<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Login | ShopNest</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body class="auth-page">

```
<div class="auth-container">

    <!-- LEFT SIDE -->
    <div class="auth-visual">

        <a href="/" class="auth-brand">
            🛍️ ShopNest
        </a>

        <div class="auth-visual-content">

            <div class="floating-shopping-icon icon-one">
                🎧
            </div>

            <div class="floating-shopping-icon icon-two">
                👟
            </div>

            <div class="floating-shopping-icon icon-three">
                📦
            </div>

            <div class="shopping-circle">
                🛍️
            </div>

            <h2>Welcome back!</h2>

            <p>
                Sign in to continue shopping,
                manage your cart and track your orders.
            </p>

        </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="auth-form-side">

        <div class="auth-form-container">

            <div class="mobile-auth-brand">
                🛍️ ShopNest
            </div>

            <div class="auth-heading">

                <p class="auth-small-title">
                    WELCOME BACK
                </p>

                <h1>Login to your account</h1>

                <p>
                    Enter your details to continue shopping.
                </p>

            </div>


            <form id="login-form" class="professional-auth-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Login
                    <span>→</span>
                </button>

            </form>


            <p
                id="message"
                class="auth-message"
            ></p>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>


            <a
                href="/"
                class="back-home-link"
            >
                ← Back to ShopNest
            </a>

        </div>

    </div>

</div>


<script src="login.js"></script>
```

</body>

</html>
