<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Create Account | ShopNest</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body class="auth-page">

```
<div class="auth-container">

    <!-- LEFT SIDE -->
    <div class="auth-visual">

        <a href="/" class="auth-brand">
            🛍️ ShopNest
        </a>

        <div class="auth-visual-content">

            <div class="floating-shopping-icon icon-one">
                🎁
            </div>

            <div class="floating-shopping-icon icon-two">
                ⭐
            </div>

            <div class="floating-shopping-icon icon-three">
                🛒
            </div>

            <div class="shopping-circle">
                ✨
            </div>

            <h2>Join ShopNest!</h2>

            <p>
                Create your account and start discovering
                products you'll love.
            </p>

        </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="auth-form-side">

        <div class="auth-form-container">

            <div class="mobile-auth-brand">
                🛍️ ShopNest
            </div>

            <div class="auth-heading">

                <p class="auth-small-title">
                    GET STARTED
                </p>

                <h1>Create your account</h1>

                <p>
                    Sign up to start shopping with ShopNest.
                </p>

            </div>


            <form
                id="register-form"
                class="professional-auth-form"
            >

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Create Account
                    <span>→</span>
                </button>

            </form>


            <p
                id="message"
                class="auth-message"
            ></p>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>


            <a
                href="/"
                class="back-home-link"
            >
                ← Back to ShopNest
            </a>

        </div>

    </div>

</div>


<script src="register.js"></script>
```

</body>

</html>
